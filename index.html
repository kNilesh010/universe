<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universe Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud">
      <div class="brand">
        <h1>Universe Explorer</h1>
        <p>Navigate as a spaceship through stars, planets, asteroids, and black holes.</p>
      </div>

      <div class="controls">
        <span><b>Move:</b> W / A / S / D + Space / Shift</span>
        <span><b>Look:</b> Hold right mouse + move</span>
        <span><b>Boost:</b> Left Ctrl</span>
        <span><b>Autopilot:</b> G</span>
      </div>

      <div class="panel">
        <label for="targetSelect">Path guidance target</label>
        <select id="targetSelect"></select>
        <button id="setTargetBtn">Set Target</button>
      </div>

      <div id="statusLine"></div>
      <div id="bodyInfo">Approach a celestial body to view details.</div>
      <div id="spaceshipIcon" aria-hidden="true">🚀</div>
    </div>

    <canvas id="scene"></canvas>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
